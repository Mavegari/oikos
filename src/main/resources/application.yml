spring:
  application:
    name: oikos

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:oikos}
    username: ${POSTGRES_USER:oikos_user}
    password: ${POSTGRES_PASSWORD:oikos_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080